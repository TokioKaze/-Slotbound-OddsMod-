; =====================================================================
;  Slotbound 稀有度概率 Mod 配置文件（适配游戏 v1.0.0(9)）  作者：TokioKaze
;  放在游戏目录（与 Slotbound.exe 同一文件夹）。修改后重启游戏生效。
;  以 ; 或 # 开头的是注释。请用 UTF-8 编码保存（Windows 记事本默认即可）。
;  每次启动都会在同目录生成 SlotboundOddsMod.log，可确认 Mod 是否加载、实际概率是多少。
; =====================================================================

[general]
; 预设（可选）：原版 / 困难 / 中等 / 简单 / 肉鸽纯爽
;   困难：老虎机 传说1% 棱彩0.3%，命运石传说/棱彩权重×1.5
;   中等：老虎机 传说2.5% 棱彩0.8%，命运石×2.5
;   简单：老虎机 传说5% 棱彩2%，命运石×4
;   肉鸽纯爽：老虎机 稀有20% 传说15% 棱彩8%，命运石×8
;   下面写了 [slot] / [stone] 就会覆盖预设中对应的部分。也可在游戏内 F8 面板一键切换。
preset =

; 总开关。false = 完全使用原版概率（Mod 仍会加载并写日志）
enabled = true

; 是否尊重解锁条件。
;   true （推荐）：原版概率为 0 的稀有度保持 0。
;           例如还没买“传说解锁/棱彩解锁”研究时，老虎机不会出传说/棱彩；
;           某些命运石本身不产出某个稀有度（如裂隙石不出高级/稀有）也保持不出。
;   false：目标概率模式下强制给这些稀有度分配概率（倍率模式下 0×任何数 仍是 0）。
respect_unlocks = true

; 配置有错时，游戏启动时弹窗提示（错误部分会自动回退为原版概率）
show_error_popup = true


; ---------------------------------------------------------------------
; 两种模式说明（mode）
;   off        ：原版概率（也可写 关闭）
;   multiplier ：权重倍率模式（也可写 倍率）。用 mult_xxx 把某稀有度的“原始权重”乘以倍数，
;                然后全部重新归一化。注意：权重 ×5 ≠ 最终概率 ×5！
;                例：老虎机原版 传说 0.4%，mult_legendary = 5 → 最终约 1.97%（不是 2%），
;                    因为其他稀有度的份额也被一起压缩了。倍数越大差别越明显。
;   target     ：目标概率模式（也可写 目标）。用 target_xxx 直接指定“最终概率”（百分比），
;                没写的稀有度按它们原来的相对比例分配剩余概率。
;                例：target_legendary = 10，target_prism = 5 → 传说 10%、棱彩 5%，
;                    普通/高级/稀有按原来 80:15:4.5 的比例分剩下的 85%。
;
; 稀有度名称：normal 普通 / advanced 高级 / rare 稀有 / legendary 传说 / prism 棱彩
; 校验规则：不能为负数；单个目标概率不能超过 100；目标概率合计不能超过 100；
;           五个都写目标概率时合计必须正好 100。不合法的分区会回退原版并在日志/弹窗中说明。
; 倍率模式只读 mult_xxx，目标模式只读 target_xxx；两种参数可以同时写着，方便切换。
; ---------------------------------------------------------------------


; 局内老虎机（进入一局后左侧老虎机，中奖召唤单位时的稀有度，即图一的“稀有度”提示）
[slot]
mode = target

; —— 目标概率模式参数（单位：%）——
target_legendary = 10
target_prism = 5
; target_rare = 8
; target_advanced = 20
; target_normal = 50

; —— 倍率模式参数（原始权重的倍数，默认 1）——
mult_normal = 1
mult_advanced = 1
mult_rare = 1
mult_legendary = 5
mult_prism = 5


; 所有命运石的默认设置（局外“命运石货架”购买的、命运石任务完成获得的、开局携带的，都用这里）
; 注意：这里是对“每块石头自己的概率表”做调整，例如
;   裂隙石原版 普通90/传说9/棱彩1，倍率 ×5 后约为 普通64.3/传说32.1/棱彩3.6
[stone]
mode = multiplier

mult_legendary = 5
mult_prism = 5

target_legendary = 10
target_prism = 5


; 可以为单块石头单独设置，会完全覆盖上面的 [stone] 设置。分区名用英文键名或中文名都可以：
;   起源石 OriginStone   微风石 BreezeStone   双子石 TwinStone      占卜石 OmenStone
;   里程石 MileStone     裂隙石 RiftStone     特殊石 SpecialStone   熟练石 MasteryStone
;   祝福石 BlessingStone 胜负石 GambitStone   星群石 ConstellationStone
;   圣域石 SanctumStone  巅峰石 ZenithStone   日蚀石 EclipseStone   银河石 GalaxyStone
; 例：让裂隙石的棱彩为 10%（去掉下面几行开头的 ; 即可启用）
; [stone.裂隙石]
; mode = target
; target_prism = 10
;
; 例：特殊石保持原版
; [stone.SpecialStone]
; mode = off


; 符号概率（职业符号，只支持目标概率；单位 %，六种合计不超过 100，未写的按原比例分配剩余）
;   W 战士  A 弓手  S 枪兵  H 骑兵  M 法师  D 决斗者
;   joker = 小丑概率（0~5，游戏代码硬上限 5%；不写则保持游戏原本由核心决定的小丑概率）
;   被核心禁用（权重为 0）的职业保持 0。
[symbols]
mode = off
; target_w = 30
; target_a = 20
; joker = 2
