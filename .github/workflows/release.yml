name: Build and publish installer
on:
  push:
    branches: [main]
    paths: [RELEASE_VERSION]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: installer-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name SlotboundOddsModSetup
          --add-data "SlotboundOddsMod.lua;."
          --add-data "SlotboundOddsMod.ini;."
          SlotboundOddsModInstaller.py
      - name: Test packaged resources and GUI
        shell: pwsh
        run: |
          foreach ($arg in @('--selftest', '--gui-smoke')) {
            $p = Start-Process -FilePath 'dist/SlotboundOddsModSetup.exe' -ArgumentList $arg -WindowStyle Hidden -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Timed out: $arg" }
            if ($p.ExitCode -ne 0) {
              Get-Content "$env:LOCALAPPDATA/SlotboundOddsMod/installer.log" -ErrorAction SilentlyContinue
              throw "Failed: $arg ($($p.ExitCode))"
            }
          }
      - name: Package bilingual release
        shell: pwsh
        run: |
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          if ($version -notmatch '^v[0-9A-Za-z.-]+$') { throw 'Invalid release version' }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $version) { throw 'Tag must match RELEASE_VERSION' }
          $name = "SlotboundOddsMod_$version"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item dist/SlotboundOddsModSetup.exe, README_FIRST_ZH.txt, README_FIRST_EN.txt, LICENSE, docs/UserGuide.md -Destination "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          "RELEASE_TAG=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }} — Standalone installer preview
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
